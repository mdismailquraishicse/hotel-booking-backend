version: '3.9'

services:
  db:
    image: postgres
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - ./src/schemas/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  hotel-booking:
    build: .
    container_name: hotel-booking
    ports:
      - "8000:8000"
    depends_on:
      - db